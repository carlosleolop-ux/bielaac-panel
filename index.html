    .login-left { background: var(--black); padding: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; border-right: 1px solid var(--border); }
    .login-left img { width: 200px; margin-bottom: 16px; }
    .login-left-sub { color: var(--text-muted); font-size: 13px; text-align: center; }
    .login-right { padding: 48px 40px; flex: 1; }
    .login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
    .form-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; background: var(--black); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; transition: border-color .2s; }
    .form-input:focus { border-color: var(--red); }
    .error-msg { background: #8B0000; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

    /* ─── BUTTONS ─── */
    .btn { padding: 10px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .1s; display: inline-flex; align-items: center; gap: 7px; }
    .btn:hover { opacity: .85; } .btn:active { transform: scale(.98); } .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--red); color: white; width: 100%; justify-content: center; padding: 13px; }
    .btn-success { background: var(--green); color: white; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-danger { background: #8B0000; color: white; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

    /* ─── LAYOUT ─── */
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--dark); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; position: sticky; top: 0; overflow-y: auto; }
    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .sidebar-header img { height: 28px; }
    .sidebar-header-text { font-size: 13px; font-weight: 700; }
    .sidebar-header-sub { font-size: 11px; color: var(--text-muted); }
    .sidebar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); padding: 14px 20px 5px; }
    .section-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all .15s; font-size: 13px; user-select: none; }
    .section-item:hover { background: rgba(255,255,255,.05); }
    .section-item.active { background: rgba(204,0,0,.12); border-left-color: var(--red); }
    .section-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .section-item .count { margin-left: auto; font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 10px; }
    .section-item .drag-handle { color: var(--text-dim); cursor: grab; font-size: 14px; margin-right: -4px; }
    .section-item.dragging { opacity: .5; background: rgba(204,0,0,.08); }
    .section-item.drag-over { border-top: 2px solid var(--red); }
    .add-section-row { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; color: var(--red); font-size: 13px; font-weight: 600; transition: background .15s; border-top: 1px solid var(--border); margin-top: 4px; }
    .add-section-row:hover { background: rgba(204,0,0,.06); }
    .sidebar-footer { margin-top: auto; padding: 14px 20px; border-top: 1px solid var(--border); }
    .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .user-avatar { width: 30px; height: 30px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .user-email { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ─── MAIN ─── */
    .main { flex: 1; overflow-y: auto; }
    .main-header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; background: var(--black); z-index: 10; }
    .main-title { font-size: 19px; font-weight: 700; }
    .main-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .main-content { padding: 28px; }

    /* ─── CARDS GRID ─── */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
    .card-tile { border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; transition: transform .15s, box-shadow .15s; border: 1px solid rgba(255,255,255,.08); }
    .card-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .card-tile.dragging { opacity: .4; }
    .card-tile.drag-over { outline: 2px dashed var(--red); outline-offset: 2px; }
    .card-tile-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .card-tile-icon { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 34px; }
    .card-tile-footer { padding: 7px 8px; font-size: 10px; font-weight: 700; text-align: center; color: white; line-height: 1.3; }
    .card-tile-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 3px; opacity: 0; transition: opacity .15s; }
    .card-tile:hover .card-tile-actions { opacity: 1; }
    .card-action-btn { width: 24px; height: 24px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .card-action-edit { background: rgba(0,0,0,.7); color: white; }
    .card-action-delete { background: rgba(204,0,0,.85); color: white; }
    .card-drag-handle { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,.5); color: white; border-radius: 4px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; opacity: 0; cursor: grab; transition: opacity .15s; }
    .card-tile:hover .card-drag-handle { opacity: 1; }
    .card-add { border-radius: 10px; border: 2px dashed rgba(255,255,255,.15); aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; gap: 6px; color: var(--text-dim); font-size: 11px; font-weight: 600; transition: all .15s; }
    .card-add:hover { border-color: var(--red); color: var(--red); background: rgba(204,0,0,.05); }

    /* ─── MODAL ─── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
    .modal { background: var(--dark); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; }
    .modal-header { padding: 22px 22px 0; display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--red); display: flex; align-items: center; gap: 8px; }
    .modal-body { padding: 22px; }
    .modal-footer { padding: 0 22px 22px; display: flex; justify-content: flex-end; gap: 8px; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 22px; padding: 2px 6px; }

    .color-grid { display: flex; gap: 7px; flex-wrap: wrap; }

    .tabs { display: flex; gap: 4px; background: var(--black); padding: 4px; border-radius: 8px; margin-bottom: 14px; }
    .tab { padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); background: transparent; transition: all .15s; }

    .icon-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; max-height: 220px; overflow-y: auto; }
    .icon-btn { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border); background: var(--black); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all .15s; }
    .icon-btn:hover { border-color: var(--red); background: rgba(204,0,0,.08); }
    .icon-btn.selected { background: var(--red); border-color: var(--red); }

    /* ─── IMAGE UPLOAD & CROP ─── */
    .img-upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: all .15s; }
    .img-upload-area:hover { border-color: var(--red); background: rgba(204,0,0,.04); }
    .img-preview { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin: 0 auto 8px; display: block; }
    .img-upload-text { font-size: 13px; color: var(--text-muted); }
    .img-upload-text strong { color: var(--red); }
    .crop-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }

    .crop-container img { max-width: 100%; max-height: 60vh; display: block; }
    .crop-actions { display: flex; gap: 12px; }

    /* ─── SECTION CONFIG ─── */
    .section-config { background: var(--dark); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    .section-color-badge { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .section-info { flex: 1; }
    .section-name { font-size: 16px; font-weight: 700; }
    .section-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .empty-state { text-align: center; padding: 72px 24px; color: var(--text-muted); }
    .empty-state-icon { font-size: 44px; margin-bottom: 14px; }
    .empty-state-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

    /* ─── MISC ─── */
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.2); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 22px; right: 22px; background: var(--green); color: white; padding: 11px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 300; animation: slideUp .3s ease; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .toast.error { background: var(--red); }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    /* ─── SUBSECTION ─── */

    .card-back { border-radius: 10px; background: #2C2C2C; border: 1px solid rgba(255,255,255,0.15); aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; gap: 6px; transition: all .15s; }

    .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  </style>
</head>

// ─── CROP HOOK ───────────────────────────────────────────────
function useCrop() {
  const [cropSrc, setCropSrc] = useState(null);
  const [cropResolve, setCropResolve] = useState(null);
  const imgRef = useRef(null);
  const cropperRef = useRef(null);

  function requestCrop(src) {
    return new Promise(resolve => {
      setCropSrc(src);
      setCropResolve(() => resolve);
    });
  }

  useEffect(() => {
    if (cropSrc && imgRef.current) {
      setTimeout(() => {
        if (cropperRef.current) cropperRef.current.destroy();
        cropperRef.current = new Cropper(imgRef.current, {
          aspectRatio: 1, viewMode: 1, movable: true, zoomable: true, scalable: false, rotatable: false,
        });
      }, 100);
    }
  }, [cropSrc]);

  function confirmCrop() {
    const canvas = cropperRef.current.getCroppedCanvas({ width: 600, height: 600 });
    canvas.toBlob(blob => {
      cropResolve(blob);
      setCropSrc(null);
      cropperRef.current.destroy();
      cropperRef.current = null;
    }, 'image/jpeg', 0.82);
  }

  function cancelCrop() {
    if (cropperRef.current) { cropperRef.current.destroy(); cropperRef.current = null; }
    setCropSrc(null);
    cropResolve(null);
  }

  const CropUI = cropSrc ? (
    <div className="crop-overlay">
      <div style={{color:'white',fontWeight:600,fontSize:15}}>📐 Enquadre a imagem</div>
      <div className="crop-container">
        <img ref={imgRef} src={cropSrc} alt="crop" style={{maxWidth:'80vw',maxHeight:'60vh'}} />
      </div>
      <div className="crop-actions">
        <button className="btn btn-ghost" onClick={cancelCrop}>Cancelar</button>
        <button className="btn btn-success" onClick={confirmCrop}>✓ Confirmar enquadramento</button>
      </div>
    </div>
  ) : null;

  return { requestCrop, CropUI };
}

function Toast({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2800); return () => clearTimeout(t); }, []);
  return <div className={`toast ${type==='error'?'error':''}`}>{msg}</div>;
}

function ColorPicker({ value, onChange }) {
  return <div className="color-grid">{COLORS.map(c=>(
    <div key={c.value} className={`color-dot${value===c.value?' selected':''}`}
      style={{background:c.hex}} title={c.label} onClick={()=>onChange(c.value)} />
  ))}</div>;
}

function IconPicker({ value, onChange }) {
  const [q,setQ] = useState('');
  const filtered = q ? ICONS.filter(i=>i.n.includes(q.toLowerCase())||i.e.includes(q)) : ICONS;
  return <>
    <input className="icon-search" placeholder="Buscar ícone..." value={q} onChange={e=>setQ(e.target.value)} />
    <div className="icon-grid">{filtered.map(i=>(
      <button key={i.n} className={`icon-btn${value===i.n?' selected':''}`}
        title={i.n} onClick={()=>onChange(i.n)}>{i.e}</button>
    ))}</div>
  </>;
}

function ImageUpload({ value, onChange, userId, requestCrop }) {
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef();

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    try {
      const src = URL.createObjectURL(file);
      const blob = await requestCrop(src);
      if (!blob) { setUploading(false); return; }
      const fileName = `${userId}/${Date.now()}.jpg`;
      const { error } = await sb.storage.from(BUCKET).upload(fileName, blob, { contentType:'image/jpeg', upsert:true });
      if (error) throw error;
      const { data } = sb.storage.from(BUCKET).getPublicUrl(fileName);
      onChange(data.publicUrl);
    } catch(err) { alert('Erro ao fazer upload: '+err.message); }
    finally { setUploading(false); e.target.value=''; }
  }

  return (
    <div className="img-upload-area" onClick={()=>!uploading&&inputRef.current.click()}>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{display:'none'}} />
      {value ? <>
        <img src={value} className="img-preview" alt="preview" />
        <div className="img-upload-text">Clique para trocar a imagem</div>
        <button className="btn btn-sm btn-danger" style={{marginTop:8}} onClick={e=>{e.stopPropagation();onChange('');}}>Remover</button>
      </> : <>
        <div style={{fontSize:30,marginBottom:8}}>{uploading?'⏳':'📷'}</div>
        <div className="img-upload-text">{uploading?'Enviando...': <><strong>Clique</strong> para adicionar uma foto</>}</div>
      </>}
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [authError, setAuthError] = useState('');
  const [authLoading, setAuthLoading] = useState(false);
  const [sections, setSections] = useState([]);
  const [cards, setCards] = useState([]);
  const [selectedSection, setSelectedSection] = useState(null);
  const [activeSubsection, setActiveSubsection] = useState(null);
  const [dataLoading, setDataLoading] = useState(false);
  const [cardModal, setCardModal] = useState(null);
  const [sectionModal, setSectionModal] = useState(null);
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [toast, setToast] = useState(null);
  const [dragSection, setDragSection] = useState(null);
  const [dragCard, setDragCard] = useState(null);
  const { requestCrop, CropUI } = useCrop();

  function showToast(msg, type='success') { setToast({msg,type,key:Date.now()}); }

  useEffect(() => {
    sb.auth.getSession().then(({data:{session}}) => { setSession(session); setLoading(false); });
    const {data:{subscription}} = sb.auth.onAuthStateChange((_,s)=>setSession(s));
    return ()=>subscription.unsubscribe();
  }, []);

  useEffect(()=>{ if(session) loadSections(); },[session]);

  async function login() {
    setAuthError(''); setAuthLoading(true);
    const {error} = await sb.auth.signInWithPassword({email,password});
    if(error) setAuthError('Email ou senha incorretos.');
    setAuthLoading(false);
  }

  async function logout() {
    await sb.auth.signOut();
    setSections([]); setCards([]); setSelectedSection(null);
  }

  async function loadSections() {
    setDataLoading(true);
    const {data} = await sb.from('sections').select('*').eq('user_id',session.user.id).order('position',{ascending:true});
    setSections(data||[]);
    if(data&&data.length>0){ setSelectedSection(data[0]); await loadCards(data[0].id); }
    setDataLoading(false);
  }

  async function loadCards(sectionId) {
    const {data} = await sb.from('cards').select('*').eq('section_id',sectionId).order('position',{ascending:true});
    setCards(data||[]);
  }

  function currentCards() {
    if (activeSubsection) {
      return cards.filter(c => c.parent_card_id === activeSubsection.id);
    }
    // Top-level: sem parent. Subseções primeiro, depois normais
    const topLevel = cards.filter(c => !c.parent_card_id);
    const subsections = topLevel.filter(c => c.type === 'subsection');
    const normals = topLevel.filter(c => c.type !== 'subsection');
    return [...subsections, ...normals];
  }

  async function selectSection(s) { setSelectedSection(s); setActiveSubsection(null); await loadCards(s.id); }

  // ─── SECTION CRUD ────
  async function saveSection(data) {
    if(sectionModal==='new') {
      const {data:newS,error} = await sb.from('sections').insert({...data,user_id:session.user.id,position:sections.length}).select().single();
      if(error){showToast('Erro ao criar seção','error');return;}
      setSections(p=>[...p,newS]); setSelectedSection(newS); setCards([]); showToast('Seção criada!');
    } else {
      const {data:upd,error} = await sb.from('sections').update(data).eq('id',sectionModal.id).select().single();
      if(error){showToast('Erro ao atualizar','error');return;}
      setSections(p=>p.map(s=>s.id===upd.id?upd:s));
      if(selectedSection?.id===upd.id) setSelectedSection(upd);
      showToast('Seção atualizada!');
    }
    setSectionModal(null);
  }

  async function deleteSection(s) {
    await sb.from('cards').delete().eq('section_id',s.id);
    await sb.from('sections').delete().eq('id',s.id);
    const ns = sections.filter(x=>x.id!==s.id);
    setSections(ns);
    if(selectedSection?.id===s.id){ setSelectedSection(ns[0]||null); if(ns[0]) await loadCards(ns[0].id); else setCards([]); }
    setDeleteConfirm(null); showToast('Seção excluída');
  }

  // ─── CARD CRUD ────
  async function saveCard(data) {
    if(cardModal==='new') {
      const insertData = {
        ...data,
        user_id: session.user.id,
        section_id: selectedSection.id,
        position: cards.length,
        parent_card_id: activeSubsection ? activeSubsection.id : null,
      };
      const {data:newC,error} = await sb.from('cards').insert(insertData).select().single();
      if(error){showToast('Erro ao criar card','error');return;}
      setCards(p=>[...p,newC]); showToast('Card criado!');
    } else {
      const {data:upd,error} = await sb.from('cards').update(data).eq('id',cardModal.id).select().single();
      if(error){showToast('Erro ao atualizar','error');return;}
      setCards(p=>p.map(c=>c.id===upd.id?upd:c)); showToast('Card atualizado!');
    }
    setCardModal(null);
  }

  async function deleteCard(card) {
    await sb.from('cards').delete().eq('id',card.id);
    setCards(p=>p.filter(c=>c.id!==card.id));
    setDeleteConfirm(null); showToast('Card excluído');
  }

  // ─── DRAG & DROP SECTIONS ────
  async function handleSectionDrop(targetId) {
    if(!dragSection||dragSection.id===targetId) return;
    const from = sections.findIndex(s=>s.id===dragSection.id);
    const to = sections.findIndex(s=>s.id===targetId);
    const newOrder = [...sections];
    newOrder.splice(from,1);
    newOrder.splice(to,0,dragSection);
    setSections(newOrder);
    setDragSection(null);
    for(let i=0;i<newOrder.length;i++){
      await sb.from('sections').update({position:i}).eq('id',newOrder[i].id);
    }
  }

  // ─── DRAG & DROP CARDS ────
  async function handleCardDrop(targetId) {
    if(!dragCard||dragCard.id===targetId) return;
    const from = cards.findIndex(c=>c.id===dragCard.id);
    const to = cards.findIndex(c=>c.id===targetId);
    const newOrder = [...cards];
    newOrder.splice(from,1);
    newOrder.splice(to,0,dragCard);
    setCards(newOrder);
    setDragCard(null);
    for(let i=0;i<newOrder.length;i++){
      await sb.from('cards').update({position:i}).eq('id',newOrder[i].id);
    }
  }

  // ─── LOGIN ────
  if(loading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}><div className="spinner" style={{width:32,height:32,borderWidth:3}} /></div>;

  if(!session) return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-left">
          <img src="logo_splashscreen.png" alt="Biel AAC" onError={e=>e.target.style.display='none'} />
          <div className="login-left-sub">Painel de configuração web</div>
        </div>
        <div className="login-right">
          <div className="login-title">Painel de Configuração</div>
          <div className="login-sub">Entre com sua conta Biel AAC para gerenciar seções e cards</div>
          {authError&&<div className="error-msg">⚠️ {authError}</div>}
          <label className="form-label">Email</label>
          <input className="form-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" onKeyDown={e=>e.key==='Enter'&&login()} />
          <label className="form-label">Senha</label>
          <input className="form-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&login()} />
          <button className="btn btn-primary" onClick={login} disabled={authLoading||!email||!password}>
            {authLoading?<span className="spinner"/>:'Entrar'}
          </button>
        </div>
      </div>
    </div>
  );

  // ─── PANEL ────
  return (
    <div className="app-layout">
      {CropUI}
      <aside className="sidebar">
        <div className="sidebar-header">
          <img src="logo_splashscreen.png" alt="Biel AAC" onError={e=>e.target.style.display='none'} />
          <div><div className="sidebar-header-text">Biel AAC</div><div className="sidebar-header-sub">Painel</div></div>
        </div>
        <div className="sidebar-label">Seções ({sections.length})</div>
        {sections.map(s=>(
          <div key={s.id}
            className={`section-item${selectedSection?.id===s.id?' active':''}${dragSection?.id===s.id?' dragging':''}`}
            onClick={()=>selectSection(s)}
            draggable
            onDragStart={()=>setDragSection(s)}
            onDragOver={e=>{e.preventDefault();}}
            onDrop={()=>handleSectionDrop(s.id)}>
            <span className="drag-handle" title="Arrastar para reordenar">⠿</span>
            <div className="dot" style={{background:colorHex(s.background_color)}} />
            <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{s.name}</span>
            <span className="count">{s.id===selectedSection?.id?cards.length:'·'}</span>
          </div>
        ))}
        <div className="add-section-row" onClick={()=>setSectionModal('new')}>+ Nova seção</div>
        <div className="sidebar-footer">
          <div className="user-row">
            <div className="user-avatar">{session.user.email[0].toUpperCase()}</div>
            <div className="user-email">{session.user.email}</div>
          </div>
          <button className="btn btn-ghost" style={{width:'100%',justifyContent:'center',fontSize:13}} onClick={logout}>Sair</button>
        </div>
      </aside>

      <main className="main">
        {selectedSection ? <>
          <div className="main-header">
            <div>
              {activeSubsection && <div className="breadcrumb">{selectedSection.name} &rsaquo;</div>}
              <div className="main-title">{activeSubsection ? activeSubsection.name : selectedSection.name}</div>
              <div className="main-sub">{currentCards().length} {currentCards().length===1?'card':'cards'}{activeSubsection?' nesta subseção':' · arraste para reordenar'}</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-ghost" onClick={()=>setSectionModal(selectedSection)}>⚙️ Editar seção</button>
              <button className="btn btn-danger" onClick={()=>setDeleteConfirm({type:'section',item:selectedSection})}>🗑️</button>
              <button className="btn btn-success" onClick={()=>setCardModal('new')}>+ Novo card</button>
            </div>
          </div>
          <div className="main-content">
            <div className="section-config">
              <div className="section-color-badge" style={{background:colorHex(selectedSection.background_color)}}>
                {selectedSection.image_path?<img src={selectedSection.image_path} style={{width:36,height:36,borderRadius:6,objectFit:'cover'}} alt="" />:iconEmoji(selectedSection.icon_name)}
              </div>
              <div className="section-info">
                <div className="section-name">{selectedSection.name}</div>
                <div className="section-meta">{selectedSection.speak_on_select?'🔊 Vocaliza ao selecionar':'🔇 Não vocaliza ao selecionar'}</div>
              </div>
            </div>
            {dataLoading?<div style={{textAlign:'center',padding:48}}><div className="spinner" style={{width:32,height:32,borderWidth:3,margin:'0 auto'}} /></div>:(
              <div className="cards-grid">
                {/* Card voltar quando dentro de subseção */}
                {activeSubsection && (
                  <div className="card-back" onClick={()=>setActiveSubsection(null)}>
                    <div className="card-back-icon">←</div>
                    <div className="card-back-label">{selectedSection.name}</div>
                  </div>
                )}
                {currentCards().map(card=>(
                  <div key={card.id} className={`card-tile${dragCard?.id===card.id?' dragging':''}`}
                    style={{background:colorHex(card.background_color),position:'relative'}}
                    draggable
                    onDragStart={()=>setDragCard(card)}
                    onDragOver={e=>e.preventDefault()}
                    onDrop={()=>handleCardDrop(card.id)}>
                    <div className="card-drag-handle" title="Arrastar">⠿</div>
                    {card.image_path?<img src={card.image_path} className="card-tile-img" alt={card.name} />
                      :<div className="card-tile-icon">{iconEmoji(card.icon_name)}</div>}
                    <div className="card-tile-footer">{card.name}</div>
                    {/* Badge de subseção */}
                    {card.type==='subsection' && (
                      <div className="subsection-badge">
                        <svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
                          <polygon points="0,42 42,42 42,0" fill="rgba(0,0,0,0.55)" />
                          <line x1="0" y1="42" x2="42" y2="0" stroke="rgba(255,255,255,0.35)" strokeWidth="1"/>
                          <text x="30" y="36" fontSize="14" textAnchor="middle" dominantBaseline="middle" fill="white">📁</text>
                        </svg>
                      </div>
                    )}
                    <div className="card-tile-actions">
                      <button className="card-action-btn card-action-edit" onClick={()=>setCardModal(card)}>✏️</button>
                      <button className="card-action-btn card-action-delete" onClick={()=>setDeleteConfirm({type:'card',item:card})}>🗑️</button>
                      {/* Botão para entrar na subseção */}
                      {card.type==='subsection' && (
                        <button className="card-action-btn" style={{background:'rgba(2,119,189,0.85)',color:'white'}}
                          onClick={()=>setActiveSubsection(card)} title="Abrir subseção">📂</button>
                      )}
                    </div>
                  </div>
                ))}
                <div className="card-add" onClick={()=>setCardModal('new')}>
                  <div style={{fontSize:22}}>+</div><div>Novo card</div>
                </div>
              </div>
            )}
          </div>
        </> : (
          <div className="empty-state">
            <div className="empty-state-icon">📂</div>
            <div className="empty-state-title">Nenhuma seção ainda</div>
            <div style={{color:'var(--text-muted)',fontSize:14,marginBottom:20}}>Crie sua primeira seção para começar</div>
            <button className="btn btn-primary" style={{margin:'0 auto'}} onClick={()=>setSectionModal('new')}>+ Criar primeira seção</button>
          </div>
        )}
      </main>

      {cardModal&&<CardModal card={cardModal==='new'?null:cardModal} sectionColor={selectedSection?.background_color} userId={session.user.id} onSave={saveCard} onClose={()=>setCardModal(null)} requestCrop={requestCrop} insideSubsection={!!activeSubsection} />}
      {sectionModal&&<SectionModal section={sectionModal==='new'?null:sectionModal} onSave={saveSection} onClose={()=>setSectionModal(null)} userId={session.user.id} requestCrop={requestCrop} />}
      {deleteConfirm&&<DeleteConfirm
        title={deleteConfirm.type==='section'?'Excluir seção':'Excluir card'}
        msg={deleteConfirm.type==='section'?`Tem certeza que deseja excluir "${deleteConfirm.item.name}"? Todos os cards serão excluídos permanentemente.`:`Tem certeza que deseja excluir o card "${deleteConfirm.item.name}"?`}
        onConfirm={()=>deleteConfirm.type==='section'?deleteSection(deleteConfirm.item):deleteCard(deleteConfirm.item)}
        onClose={()=>setDeleteConfirm(null)} />}
      {toast&&<Toast key={toast.key} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)} />}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
